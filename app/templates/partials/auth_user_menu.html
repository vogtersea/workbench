{# 顶栏右侧：当前用户 + 角色徽标 + 退出（用户管理入口统一放在侧边栏导航，避免重复）。 #}
{% if me %}
<span class="topbar-user" title="{{ me.username }}">
  <span class="topbar-username">{{ me.display_name or me.username }}</span>
  {% if me.role == 'admin' %}
  <span class="badge badge-admin">管理员</span>
  {% else %}
  <span class="badge badge-user">成员</span>
  {% endif %}
</span>
<form method="post" action="/logout" class="inline-form">
  <button type="submit" class="btn btn-ghost btn-sm">退出</button>
</form>
{% elif auth_enabled %}
<form method="post" action="/logout" class="inline-form">
  <button type="submit" class="btn btn-ghost btn-sm">退出</button>
</form>
{% elif mode == 'open' %}
{# 初始化入口统一放在侧边栏（base.html 已有），顶栏不再重复，避免窄屏挤压标题 #}
{% endif %}
