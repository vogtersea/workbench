<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · {{ BRAND.NAME }}</title>
<link rel="icon" href="/static/favicon.ico" sizes="any">
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<script>
(function () {
  try {
    var saved = localStorage.getItem("wb-theme");
    if (saved === "dark" || saved === "light") {
      document.documentElement.setAttribute("data-theme", saved);
    }
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="/static/app.css?v={{ asset_v() }}">
<link rel="stylesheet" href="/static/auth.css?v={{ asset_v() }}">
<script src="/static/app.js?v={{ asset_v() }}" defer></script>
<script src="/static/theme.js?v={{ asset_v() }}" defer></script>
</head>
<body class="auth-body">
<main class="auth-card">
  <img class="auth-logo" src="/static/logo.svg" alt="" width="56" height="56">
  <h1 class="auth-title">{{ BRAND.NAME }}</h1>
  <p class="auth-tagline">{{ BRAND.TAGLINE }}</p>
  {% if mode == 'legacy' %}
  <p class="muted small auth-sub">请输入访问口令</p>
  {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
  <form method="post" action="/login" class="form">
    <input type="hidden" name="next" value="{{ next_url or '/' }}">
    <div class="field">
      <label class="label" for="password">口令</label>
      <input class="input" id="password" name="password" type="password"
             autocomplete="current-password" required autofocus>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">登录</button>
    </div>
  </form>
  {% else %}
  <p class="muted small auth-sub">请使用用户名与密码登录</p>
  {% include "partials/auth_flash.html" %}
  <form method="post" action="/login" class="form">
    <input type="hidden" name="next" value="{{ next_url or '/' }}">
    <div class="field">
      <label class="label" for="username">用户名</label>
      <input class="input" id="username" name="username" type="text"
             value="{{ username or '' }}" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label class="label" for="password">密码</label>
      <input class="input" id="password" name="password" type="password"
             autocomplete="current-password" required>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">登录</button>
    </div>
  </form>
  <p class="muted small auth-foot">没有账号？请向管理员索取邀请码后自助注册。</p>
  {% endif %}
</main>
</body>
</html>
